spring.application.name=usuarios
server.port=8081

# PostgreSQL (Railway: DATABASE_URL o local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=usuarios}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=usuarios

# Flyway (Railway: schema por servicio)
spring.flyway.enabled=true
spring.flyway.schemas=usuarios
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# Eureka Client
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# OAuth2 Resource Server (JWT validation from authserver)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:9000}

# Feign Client
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=basic

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
