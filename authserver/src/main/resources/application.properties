spring.application.name=authserver
server.port=9000

# PostgreSQL (Railway usa DATABASE_URL por defecto)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=authserver}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=authserver

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=authserver
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true

# Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka
eureka.instance.prefer-ip-address=true

# RSA Keys for JWT (base64 strings via env vars, classpath backup for local)
jwt.rsa.public-key=${RSA_PUBLIC_KEY:classpath:keys/public.pem}
jwt.rsa.private-key=${RSA_PRIVATE_KEY:classpath:keys/private.pem}

# Usuarios microservice URL (for sync after register)
usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8081}
